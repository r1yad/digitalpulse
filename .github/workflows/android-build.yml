name: Android Build & APK Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Restore or Generate Debug Keystore
        run: |
          echo "Setting up debug.keystore for :app:validateSigningDebug..."
          # 1. Try decoding from debug.keystore.base64 if available
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore || base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # 2. If debug.keystore does not exist or is empty, generate it via keytool
          if [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore using keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Ensure keystore is accessible in root, app directory, and ~/.android
          cp -f debug.keystore app/debug.keystore || true
          mkdir -p ~/.android && cp -f debug.keystore ~/.android/debug.keystore || true
          ls -la debug.keystore

      - name: Configure Gradle Execution Command
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
            echo "Using Gradle wrapper: ./gradlew"
          else
            echo "Gradle wrapper not found, generating wrapper..."
            gradle wrapper || true
            if [ -f "./gradlew" ]; then
              chmod +x ./gradlew
              echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
            else
              echo "GRADLE_CMD=gradle" >> $GITHUB_ENV
            fi
            echo "Using: $GRADLE_CMD"
          fi

      - name: Run Unit Tests
        run: $GRADLE_CMD testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: $GRADLE_CMD assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (if signing configured)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding upload keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/release.jks"
            export KEYSTORE_PATH="${{ github.workspace }}/release.jks"
            export STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
            export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
            $GRADLE_CMD assembleRelease --no-daemon --stacktrace
          else
            echo "Release keystore secret not set; skipping release build."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalPulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          overwrite: true

      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DigitalPulse-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true